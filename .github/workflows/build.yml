name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
            - uses: android-actions/setup-android@v3
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Trova (ed eventualmente estrai) il progetto
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then unzip -q -o "$ZIP" -d project; fi
          SETTINGS=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          echo "ROOT=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Compila
        run: cd "$ROOT" && gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteBuddy-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
